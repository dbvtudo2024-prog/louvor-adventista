    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛪</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛪</text></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121214" />
  </head>
  <body>
    <script>
      // Safe rejection and error handling for iframe and sandboxed environments
      window.addEventListener('unhandledrejection', function(event) {
        // Prevent default browser error reporting and noisy console.error crashes
        if (event) {
          event.preventDefault();
        }
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.name || String(reason))) || '';
        // Suppress expected iframe/browser environment warnings
        if (
          msg.includes('play()') ||
          msg.includes('pause()') ||
          msg.includes('wakeLock') ||
          msg.includes('clipboard') ||
          msg.includes('AbortError') ||
          msg.includes('NotAllowedError') ||
          msg.includes('ResizeObserver') ||
          msg.includes('getScreenDetails')
        ) {
          return;
        }
        console.warn('Silenced unhandled promise rejection:', reason);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
